<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ساعت باینری کوتاه</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="binaryClock">
    <div class="unit" id="hours">
        <div class="unit-label">ساعت</div>
        <div class="bits"></div>
    </div>
    <div class="unit" id="minutes">
        <div class="unit-label">دقیقه</div>
        <div class="bits"></div>
    </div>
    <div class="unit" id="seconds">
        <div class="unit-label">ثانیه</div>
        <div class="bits"></div>
    </div>
</div>

<script src="./script.js"></script>

</body>
</html>
