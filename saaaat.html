<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ساعت باینری کوتاه</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    color: #0ff;
    font-family: monospace;
}
#binaryClock {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
}
.unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}
.unit-label {
    font-size: 1.2rem;
    text-align: center;
}
.bits {
    display: flex;
    gap: 5px;
}
.flip-container {
    perspective: 1000px;
}
.flip-card {
    position: relative;
    width: 40px;
    height: 60px;
    line-height: 60px;
    text-align: center;
    font-size: 1.5rem;
    background: #111;
    color: #0ff;
    border-radius: 8px;
    box-shadow: 0 0 10px #0ff inset;
    overflow: hidden;
}
.top, .bottom, .flip-top, .flip-bottom {
    position: absolute;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
}
.top { top:0; height:100%; }
.bottom { bottom:0; height:50%; visibility:hidden; }
.flip-top { top:0; height:50%; transform-origin:bottom; visibility:hidden; }
.flip-bottom { bottom:0; height:50%; transform-origin:top; transform:rotateX(90deg); visibility:hidden; }
.animate .flip-top { visibility:visible; animation:flipTop .35s forwards; }
.animate .flip-bottom { visibility:visible; animation:flipBottom .35s forwards; }
@keyframes flipTop {0%{transform:rotateX(0)}100%{transform:rotateX(-90deg)}}
@keyframes flipBottom {0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@media(max-width:600px){.flip-card{width:30px;height:45px;line-height:45px;font-size:1rem;}}
</style>
</head>
<body>

<div id="binaryClock">
    <div class="unit" id="hours">
        <div class="unit-label">ساعت</div>
        <div class="bits"></div>
    </div>
    <div class="unit" id="minutes">
        <div class="unit-label">دقیقه</div>
        <div class="bits"></div>
    </div>
    <div class="unit" id="seconds">
        <div class="unit-label">ثانیه</div>
        <div class="bits"></div>
    </div>
</div>

<script>
function createFlipCard(value){
    const container = document.createElement('div');
    container.className = 'flip-container';
    container.innerHTML = `
        <div class='flip-card'>
            <div class='top'>${value}</div>
            <div class='bottom'>${value}</div>
            <div class='flip-top'>${value}</div>
            <div class='flip-bottom'>${value}</div>
        </div>`;
    return container;
}

function flipDigit(card,newValue){
    const top = card.querySelector('.top');
    const bottom = card.querySelector('.bottom');
    const flipTop = card.querySelector('.flip-top');
    const flipBottom = card.querySelector('.flip-bottom');
    const flipCard = card.querySelector('.flip-card');

    if(top.innerText == newValue) return;

    flipTop.innerText = top.innerText;
    flipBottom.innerText = newValue;
    bottom.innerText = newValue;
    flipCard.classList.add('animate');
    setTimeout(()=>{ top.innerText=newValue; flipCard.classList.remove('animate'); },350);
}

function updateUnit(unitId,value,maxBits){
    const unitDiv = document.getElementById(unitId).querySelector('.bits');
    const binStr = value.toString(2).padStart(maxBits,'0');
    if(unitDiv.childNodes.length !== binStr.length){
        unitDiv.innerHTML='';
        for(let ch of binStr){
            unitDiv.appendChild(createFlipCard(ch));
        }
        return;
    }
    binStr.split('').forEach((v,i)=>{
        flipDigit(unitDiv.childNodes[i],v);
    });
}

setInterval(()=>{
    const now = new Date();
    updateUnit('hours',now.getHours(),5);  // ساعت 0-23 → 5 بیت
    updateUnit('minutes',now.getMinutes(),6); // دقیقه 0-59 → 6 بیت
    updateUnit('seconds',now.getSeconds(),6); // ثانیه 0-59 → 6 بیت
},1000);
</script>

</body>
</html>
